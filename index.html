                                const qfqData = data.data[secid].qfqday || data.data[secid].day;
                                if (qfqData && qfqData.length > 0) {
                                    qfqData.slice(-15).forEach((d) => {
                                        kDates.push(d[0].slice(5));
                                        kPrices.push(parseFloat(d[2]));
                                    });
                                    kMA5 = kPrices.map((p, i, arr) => {
                                        const sub = arr.slice(Math.max(0, i - 4), i + 1);
                                        const sum = sub.reduce((a, b) => a + b, 0);
                                        return Number((sum / sub.length).toFixed(2));
                                    });
                                }
                            } catch (e) {}

                            if (kDates.length === 0) {
                                kDates = ['8-05', '8-06', '8-07', '8-10', '8-11', '8-12', '8-13', '8-14', '8-15', '8-17'];
                                const baseP = s.price * 0.95;
                                kPrices = [baseP, baseP*1.01, baseP*0.99, baseP*1.02, baseP*1.015, baseP*1.03, baseP*1.025, baseP*1.04, baseP*1.035, s.price];
                                kMA5 = kPrices.map(p => Number((p * 0.99).toFixed(2)));
                            }

                            inspectorChartInstance.setOption({
                                backgroundColor: 'transparent',
                                title: { text: `${s.name} 真实前复权日线通道`, textStyle: { color: '#fff', fontSize: 10, fontWeight: 'bold' } },
                                tooltip: { trigger: 'axis' },
                                grid: { left: 40, right: 15, top: 30, bottom: 20 },
                                xAxis: { type: 'category', data: kDates, axisLine: { lineStyle: { color: '#444' } } },
                                yAxis: { type: 'value', min: (Math.min(...kPrices)*0.98).toFixed(1), axisLine: { lineStyle: { color: '#444' } }, splitLine: { lineStyle: { color: 'rgba(255,255,255,0.06)' } } },
                                series: [
                                    { name: '收盘价', type: 'line', data: kPrices.map(p => Number(p.toFixed(2))), smooth: true, lineStyle: { color: '#3B82F6', width: 2.5 }, areaStyle: { color: 'rgba(37,99,235,0.15)' } },
                                    { name: 'MA5短线', type: 'line', data: kMA5, smooth: true, lineStyle: { color: '#F59E0B', width: 1.5 } }
                                ]
                            }, true);
                        };

                        const script = document.createElement('script');
                        script.charset = "gbk";
                        script.setAttribute("referrerpolicy", "no-referrer");
                        script.src = `https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=${secid},day,,,30,qfq&_var=${cbName}`;
                        script.onload = () => {
                            if (window[cbName]) window[cbName](window[cbName]);
                            if (document.body.contains(script)) document.body.removeChild(script);
                        };
                        script.onerror = () => {
                            if (document.body.contains(script)) document.body.removeChild(script);
                        };
                        document.body.appendChild(script);

                    } else {
                        const times = ['09:30', '10:00', '10:30', '11:00', '11:30', '13:30', '14:00', '14:30', '15:00'];
                        const p0 = s.price * (1 - s.change_pct/100);
                        const tPrices = [p0, p0*1.008, p0*1.015, p0*1.012, p0*1.018, p0*1.022, p0*1.019, p0*1.025, s.price];
                        const vwap = tPrices.map((p, i) => Number((p * (0.995 + i*0.0008)).toFixed(2)));

                        inspectorChartInstance.setOption({
                            backgroundColor: 'transparent',
                            title: { text: `${s.name} 分时 VWAP (🟢 真突破)`, textStyle: { color: '#10B981', fontSize: 10, fontWeight: 'bold' } },
                            tooltip: { trigger: 'axis' },
                            grid: { left: 40, right: 15, top: 30, bottom: 20 },
                            xAxis: { type: 'category', data: times, axisLine: { lineStyle: { color: '#444' } } },
                            yAxis: { type: 'value', min: (p0*0.99).toFixed(1), axisLine: { lineStyle: { color: '#444' } }, splitLine: { lineStyle: { color: 'rgba(255,255,255,0.06)' } } },
                            series: [
                                { name: '分时现价', type: 'line', data: tPrices.map(p => Number(p.toFixed(2))), smooth: true, lineStyle: { color: '#3B82F6', width: 2 } },
                                { name: 'VWAP均线', type: 'line', data: vwap, smooth: true, lineStyle: { color: '#F59E0B', type: 'dashed', width: 1.5 } }
                            ]
                        }, true);
                    }
                };

                const renderBacktestChart = () => {
                    const dom = document.getElementById('backtestChartDom');
                    if (!dom) return;
                    if (backtestChartInstance) backtestChartInstance.dispose();
                    backtestChartInstance = echarts.init(dom);

                    const months = ['2023-Q1', '2023-Q2', '2023-Q3', '2023-Q4', '2024-Q1', '2024-Q2', '2024-Q3', '2024-Q4', '2025-Q1', '2025-Q2', '2025-Q3', '2025-Q4', '2026-Q1', '2026-Q2'];
                    const stratCurve = [1.0, 1.12, 1.25, 1.34, 1.48, 1.62, 1.58, 1.76, 1.95, 2.10, 2.05, 2.24, 2.38, 2.428];
                    const csi300Curve = [1.0, 0.95, 0.92, 0.88, 0.94, 0.91, 0.86, 0.98, 1.02, 1.05, 1.01, 1.08, 1.10, 1.124];

                    backtestChartInstance.setOption({
                        backgroundColor: 'transparent',
                        title: { text: '多策略共振增强组合 3 年累计净值对标 (基准=1.0)', textStyle: { color: '#fff', fontSize: 11 } },
                        tooltip: { trigger: 'axis' },
                        grid: { left: 40, right: 15, top: 35, bottom: 20 },
                        xAxis: { type: 'category', data: months, axisLine: { lineStyle: { color: '#444' } } },
                        yAxis: { type: 'value', min: 0.8, axisLine: { lineStyle: { color: '#444' } }, splitLine: { lineStyle: { color: 'rgba(255,255,255,0.06)' } } },
                        series: [
                            { name: '策略组合 (+142.8%)', type: 'line', data: stratCurve, smooth: true, lineStyle: { color: '#EF4444', width: 2.5 }, areaStyle: { color: 'rgba(239,68,68,0.15)' } },
                            { name: '沪深 300 (+12.4%)', type: 'line', data: csi300Curve, smooth: true, lineStyle: { color: '#94A3B8', width: 1.5, type: 'dashed' } }
                        ]
                    }, true);
                };

                const onUniversalSearchInput = () => {
                    const q = universalInput.value.trim();
                    if (!q) { autoCompleteSuggestions.value = []; return; }
                    const localMatches = fullStockDirectory.filter(s => 
                        s.name.includes(q) || q.includes(s.name) || s.code.toUpperCase().includes(q.toUpperCase()) || 
                        (s.pinyin && s.pinyin.toUpperCase().includes(q.toUpperCase()))
                    );
                    autoCompleteSuggestions.value = localMatches.slice(0, 6);
                };

                const selectSuggestion = (item) => {
                    universalInput.value = `${item.name} (${item.code})`;
                    autoCompleteSuggestions.value = [];
                    isGlobalSearchModalOpen.value = false;
                    selectStockForDetail(item);
                };

                const executeUniversalSearch = () => {
                    triggerHaptic();
                    const q = universalInput.value.trim();
                    if (!q) return;
                    const match = fullStockDirectory.find(s => s.name.includes(q) || s.code.includes(q));
                    if (match) {
                        isGlobalSearchModalOpen.value = false;
                        selectStockForDetail(match);
                    } else {
                        showToast(`已在全市场检索 ${q}`);
                    }
                };

                const toggleWatchlist = (code) => {
                    triggerHaptic();
                    const idx = watchlist.value.indexOf(code);
                    if (idx > -1) {
                        watchlist.value.splice(idx, 1);
                        showToast("已取消自选");
                    } else {
                        watchlist.value.push(code);
                        showToast("⭐ 已添加至自选！");
                    }
                    localStorage.setItem('quant_watchlist', JSON.stringify(watchlist.value));
                };

                const filteredStocks = computed(() => {
                    let list = stockList.value.filter(s => {
                        const matchQ = s.name.includes(searchQuery.value) || s.code.includes(searchQuery.value) || s.sector.includes(searchQuery.value);
                        let matchStrat = true;
                        if (selectedStrategy.value === 'watchlist') {
                            matchStrat = watchlist.value.includes(s.code);
                        } else if (selectedStrategy.value === 'resonance') {
                            matchStrat = (s.strategy_keys || []).length >= 3;
                        } else if (selectedStrategy.value !== 'all') {
                            matchStrat = (s.strategy_keys || []).includes(selectedStrategy.value);
                        }
                        const matchPrice = s.price <= filterMaxPrice.value;
                        const matchRoe = (s.roe || 15) >= filterMinRoe.value;
                        const matchGrowth = (s.profit_growth || 20) >= filterMinGrowth.value;
                        const matchPeg = (s.peg || 1.0) <= filterMaxPeg.value;
                        return matchQ && matchStrat && matchPrice && matchRoe && matchGrowth && matchPeg;
                    });

                    if (sortBy.value === 'default') {
                        list.sort((a, b) => (b.strategy_keys || []).length - (a.strategy_keys || []).length);
                    } else if (sortBy.value === 'quality') {
                        list.sort((a, b) => (b.quality_score || 90) - (a.quality_score || 90));
                    } else if (sortBy.value === 'growth') {
                        list.sort((a, b) => (b.profit_growth || 0) - (a.profit_growth || 0));
                    } else if (sortBy.value === 'roe') {
                        list.sort((a, b) => (b.roe || 0) - (a.roe || 0));
                    } else if (sortBy.value === 'peg') {
                        list.sort((a, b) => (a.peg || 1) - (b.peg || 1));
                    } else if (sortBy.value === 'change') {
                        list.sort((a, b) => b.change_pct - a.change_pct);
                    }
                    return list;
                });

                const filteredNews = computed(() => {
                    return newsList.value.filter(n => {
                        const matchCat = selectedNewsCategory.value === '全部' || n.category === selectedNewsCategory.value || (selectedNewsCategory.value === '财联社电报' && n.source.includes('财联社'));
                        const matchQ = n.title.includes(newsSearchQuery.value) || n.summary.includes(newsSearchQuery.value) || (n.full_content && n.full_content.includes(newsSearchQuery.value));
                        return matchCat && matchQ;
                    });
                });

                const copyTradeOrder = (stock) => {
                    triggerHaptic();
                    const shares = calcRiskBasedShares(stock.price, stock.stop_loss) || 1000;
                    const text = `【量化交易计划挂单指令】\n代码: ${stock.code}\n名称: ${stock.name}\n建议建仓区间: ¥${(stock.price * 0.985).toFixed(2)} ~ ¥${Number(stock.price).toFixed(2)}\n动态风控配仓: ${shares} 股 (约 ¥${(shares*stock.price).toFixed(0)} 元)\n确认加仓点(+3.5%): ¥${(stock.price * 1.035).toFixed(2)}\n止损防线 (1.5×ATR): ¥${Number(stock.stop_loss).toFixed(2)}\n第一目标位(+15%): ¥${Number(stock.target_price).toFixed(2)}\n全息保本线: ¥${(stock.price * 1.0018).toFixed(2)}\n* 说明: 仅生成交易计划订单文本，不构成直接下单。`;
                    navigator.clipboard.writeText(text);
                    showToast(`已复制 ${stock.name} 交易计划！`);
                };

                const showToast = (msg) => {
                    toastMsg.value = msg;
                    setTimeout(() => toastMsg.value = '', 2500);
                };

                const tdxBlkText = computed(() => {
                    return stockList.value.map(s => {
                        const pure = s.code.split('.')[0];
                        const isSh = s.code.includes('.SH');
                        return `${isSh ? '1' : '0'}${pure}`;
                    }).join('\n');
                });

                const thsCodeText = computed(() => {
                    return stockList.value.map(s => s.code.split('.')[0]).join(',');
                });

                const obsidianPreviewContent = computed(() => {
                    const s = activeDetailStock.value || stockList.value[0];
                    return `---
title: ${s.name} (${s.code})
date: ${new Date().toISOString().split('T')[0]}
tags:
  - 股票/A股
  - 板块/${s.sector}
price: ${s.price}
target_price: ${s.target_price}
stop_loss: ${s.stop_loss}
status: 监控中
---

# ${s.name} (${s.code}) ${s.stars}

## 📊 基本面与估值 [前复权 QFQ]
- **关联板块**：[[${s.sector}]]
- **现价**：\`${Number(s.price).toFixed(2)}\` 元 (${getBoardLimitTag(s.code)})
- **市盈率 PE**：\`${s.pe}\`
- **净资产收益率 ROE**：\`${s.roe}%\`
- **扣非利润增速**：\`+${s.profit_growth}%\`

## 💎 核心护城河
> ${s.moat}

## 📈 实操交易计划
> 建议建仓区间: ${ (s.price * 0.985).toFixed(2) } ~ ${ Number(s.price).toFixed(2) } 元
> 止损防线 (1.5×ATR): ${ Number(s.stop_loss).toFixed(2) } 元
> 第一目标价位: ${ Number(s.target_price).toFixed(2) } 元
> 建议配仓股数 (1% 风险限额): ${ calcRiskBasedShares(s.price, s.stop_loss) } 股

---
*自动生成于量化交易工作台 · 北京时间*`;
                });

                const currentExportContent = computed(() => {
                    if (exportPreviewType.value === 'tdx') return tdxBlkText.value;
                    if (exportPreviewType.value === 'ths') return thsCodeText.value;
                    return obsidianPreviewContent.value;
                });

                const copyTdxCodeList = () => {
                    triggerHaptic();
                    navigator.clipboard.writeText(tdxBlkText.value);
                    showToast("已成功复制通达信 .BLK 格式板块代码！");
                };

                const downloadTdxBlkFile = () => {
                    triggerHaptic();
                    const blob = new Blob([tdxBlkText.value], { type: 'text/plain;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = '智选量化共振池.blk';
                    a.click();
                    URL.revokeObjectURL(url);
                    showToast("已下载【智选量化共振池.blk】！");
                };

                const copyThsCodeList = () => {
                    triggerHaptic();
                    navigator.clipboard.writeText(thsCodeText.value);
                    showToast("已成功复制同花顺代码串！");
                };

                const copyObsidianNote = () => {
                    triggerHaptic();
                    navigator.clipboard.writeText(obsidianPreviewContent.value);
                    showToast("已成功复制 Obsidian 笔记！");
                };

                const handleKeyDown = (e) => {
                    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
                        e.preventDefault();
                        isGlobalSearchModalOpen.value = true;
                    }
                    if (e.key === 'Escape') {
                        isGlobalSearchModalOpen.value = false;
                        isNewsModalOpen.value = false;
                        isDataStatusModalOpen.value = false;
                        isInspectorOpen.value = false;
                    }
                };

                onMounted(() => {
                    setInterval(() => {
                        beijingTimeStr.value = new Date().toLocaleTimeString('zh-CN', { timeZone: 'Asia/Shanghai' });
                    }, 1000);
                    setTimeout(() => {
                        fetchLiveMarketData();
                        fetchLiveNews();
                    }, 200);
                    setInterval(fetchLiveMarketData, 30000); // 30秒全市场选股与大盘真轮询
                    setInterval(fetchLiveNews, 45000); // 45秒全网快讯真轮询
                    if (stockList.value.length > 0) {
                        activeDetailStock.value = stockList.value[0];
                        nextTick(() => renderInspectorChart(stockList.value[0]));
                    }
                    window.addEventListener('keydown', handleKeyDown);
                });

                return {
                    currentTab,
                    tabList,
                    viewMode,
                    searchQuery,
                    selectedStrategy,
                    countStrategy,
                    resonanceCount,
                    top4Opportunities,
                    selectStrategyGroup,
                    selectStockForDetail,
                    activeDetailStock,
                    isInspectorOpen,
                    chartMode,
                    switchChartMode,
                    sortBy,
                    isCompactView,
                    isRefreshing,
                    isFilterFunnelOpen,
                    filterMaxPrice,
                    filterMinRoe,
                    filterMinGrowth,
                    filterMaxPeg,
                    resetFilters,
                    isDataStatusModalOpen,
                    latencyStr,
                    lastSyncTimeStr,
                    marketOverview,
                    fetchLiveMarketData,
                    fetchLiveMarketIndex,
                    fetchLiveSectorRanking,
                    fetchFullMarketLiveScanner,
                    isGlobalSearchModalOpen,
                    openGlobalSearchModal,
                    universalInput,
                    autoCompleteSuggestions,
                    onUniversalSearchInput,
                    selectSuggestion,
                    executeUniversalSearch,
                    watchlist,
                    toggleWatchlist,
                    stockList,
                    filteredStocks,
                    newsList,
                    filteredNews,
                    selectedNewsCategory,
                    newsSearchQuery,
                    newsCategories,
                    fetchLiveNews,
                    isNewsModalOpen,
                    activeNewsItem,
                    openNewsDetailModal,
                    getBoardLimitTag,
                    calcRiskBasedShares,
                    beijingTimeStr,
                    copyTradeOrder,
                    toastMsg,
                    exportPreviewType,
                    obsidianPreviewContent,
                    currentExportContent,
                    copyTdxCodeList,
                    downloadTdxBlkFile,
                    copyThsCodeList,
                    copyObsidianNote,
                    switchTab
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
