<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quant System V3200</title><style>:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#e5e5ea;--green:#34c759;--red:#ff3b30;--blue:#007aff;--shadow:0 10px 30px #0000000b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif}header{position:sticky;top:0;z-index:5;background:#f5f5f7dd;backdrop-filter:blur(18px);border-bottom:1px solid #ddd;padding:18px 28px;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:4px}.pill{padding:7px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px}.ok{color:#087f23}.bad{color:#b42318}.wrap{max-width:1400px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.label{font-size:12px;color:var(--muted)}.big{font-size:28px;font-weight:700;margin-top:8px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.section{margin-top:24px}.section h2{font-size:18px;margin:0 0 12px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 9px;border-bottom:1px solid var(--line);font-size:13px;text-align:left}.table th{color:var(--muted);font-weight:500}.badge{border-radius:8px;padding:4px 7px;background:#f2f2f7;font-size:11px}.empty{padding:28px;text-align:center;color:var(--muted)}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid{grid-template-columns:1fr}.wrap{padding:14px}header{padding:14px}}</style></head><body><header><div><h1>波段共振 · 智选量化</h1><div class="sub">Gemini UI × V3200 Real Data Engine · 不生成虚假行情</div></div><div id="status" class="pill">正在读取...</div></header><main class="wrap"><div class="grid"><div class="card"><div class="label">扫描股票</div><div id="scanned" class="big">—</div></div><div class="card"><div class="label">可交易股票池</div><div id="universe" class="big">—</div></div><div class="card"><div class="label">精选数量</div><div id="picks" class="big">—</div></div><div class="card"><div class="label">数据状态</div><div id="quality" class="big" style="font-size:18px">—</div></div></div><section class="section card"><div class="row"><h2>大盘</h2><span id="marketTime" class="label">—</span></div><table class="table"><thead><tr><th>指数</th><th>点位</th><th>涨跌</th><th>更新时间</th></tr></thead><tbody id="indices"></tbody></table></section><section class="section card"><h2>今日精选</h2><table class="table"><thead><tr><th>股票</th><th>价格</th><th>涨跌</th><th>共振</th><th>综合分</th><th>等级</th></tr></thead><tbody id="signals"></tbody></table></section><section class="section card"><h2>最新新闻</h2><div id="news"></div></section></main><script>async function j(p){try{return await (await fetch(p+'?t='+Date.now(),{cache:'no-store'})).json()}catch(e){return null}}function esc(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'\\\\','"':'&quot;'}[m]))}async function load(){const[m,s,n,q]=await Promise.all([j('data/market_eod.json'),j('data/signals_eod.json'),j('data/news_feed.json'),j('data/provider_health.json')]);if(!m||!s){document.getElementById('status').textContent='数据文件不可用';document.getElementById('status').className='pill bad';return}const st=await j('data/scan_status.json');document.getElementById('status').textContent=q?.status||'DATA';document.getElementById('status').className='pill '+((q?.status||'').includes('REAL')?'ok':'bad');document.getElementById('scanned').textContent=st?.total_scanned??'—';document.getElementById('universe').textContent=st?.tradeable_universe??'—';document.getElementById('picks').textContent=Array.isArray(s)?s.length:'—';document.getElementById('quality').textContent=q?.fundamentals||q?.status||'—';document.getElementById('marketTime').textContent=m.data_status+' · '+(m.date||'');document.getElementById('indices').innerHTML=(m.indices||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${Number(x.price).toFixed(2)}</td><td class="${x.change_pct>=0?'ok':'bad'}">${Number(x.change_pct).toFixed(2)}%</td><td>${esc(x.update_time||'')}</td></tr>`).join('');document.getElementById('signals').innerHTML=s.slice(0,30).map(x=>`<tr><td><b>${esc(x.name)}</b><br><span class="label">${esc(x.code)}</span></td><td>${Number(x.price).toFixed(2)}</td><td>${Number(x.change_pct||0).toFixed(2)}%</td><td><span class="badge">${x.resonance_count||0}策略</span></td><td>${x.comp_score??'—'}</td><td>${esc(x.tier_name||x.tier||'—')}</td></tr>`).join('');document.getElementById('news').innerHTML=(n||[]).slice(0,12).map(x=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><b>${esc(x.title)}</b><div class="sub">${esc(x.source)} · ${esc(x.time)}</div></div>`).join('')||'<div class="empty">暂无已验证新闻</div>'}load()</script></body></html>
