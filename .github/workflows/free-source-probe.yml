name: 免费数据源连通性实验
on:
  push:
    paths:
      - 'scripts/free_source_probe.py'
      - 'requirements.txt'
      - '.github/workflows/free-source-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Probe free sources only
        run: python scripts/free_source_probe.py
      - name: Publish probe result
        if: always()
        run: |
          git config user.name 'quant-bot'
          git config user.email 'quant-bot@users.noreply.github.com'
          git add data/free_source_probe.json
          git diff --cached --quiet || git commit -m 'data: free source connectivity probe'
          git push
