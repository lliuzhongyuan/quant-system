name: V2300 代码验证
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Python syntax
        run: python -m py_compile scripts/*.py
      - name: JavaScript syntax
        run: node --check app.js && node --check bootstrap.js
      - name: JSON validation
        run: python -c "import json,glob; [json.load(open(p,encoding='utf-8')) for p in glob.glob('data/*.json')]; print('JSON OK')"
      - name: Required files
        run: test -f index.html && test -f app.js && test -f bootstrap.js && test -f style.css && test -f scripts/engine.py && test -f scripts/backtest.py && test -f scripts/market_snapshot.py && test -f scripts/run_pipeline.py && test -f .github/workflows/market-snapshot.yml && test -f .github/workflows/daily-scan.yml
      - name: UI sanity
        run: grep -q '智选 Quant' app.js && grep -q 'backtest.json' app.js && grep -q 'Apple' style.css || true
