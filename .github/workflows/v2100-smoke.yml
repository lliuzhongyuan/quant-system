name: V2100 数据源烟雾测试
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Eastmoney market API smoke test
        run: python scripts/market_snapshot.py
      - name: Assert real market payload
        run: python -c "import json; d=json.load(open('data/market.json',encoding='utf-8')); print('universe=',d['count']); assert d['count']>1000"
