name: A-Share Quant Daily Automated Engine

on:
  schedule:
    # 按照北京时间 (UTC+8) 每个交易日定时自动运行:
    # 1. 早盘起爆雷达: 09:45 (对应 UTC 时间 01:45)
    - cron: '45 1 * * 1-5'
    # 2. 午盘盘中复盘: 11:35 (对应 UTC 时间 03:35)
    - cron: '35 3 * * 1-5'
    # 3. 收盘全量智选: 15:15 (对应 UTC 时间 07:15)
    - cron: '15 7 * * 1-5'
  workflow_dispatch: # 开启此项支持随时在 GitHub 网页上手动点击“立即运行”
  push:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-screener-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 2. 初始化 Python 3.11 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 安装量化与数据抓取依赖
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: 4. 执行全市场选股与财联社/东财全网新闻抓取
        run: |
          python3 scripts/run_full_quant.py

      - name: 5. 自动发布最新量化大屏至 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          publish_branch: gh-pages
