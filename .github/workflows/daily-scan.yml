name: 每日全市场量化扫描
on:
  schedule:
    - cron: '50 0 * * 1-5'
    - cron: '20 7 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quant-daily-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Run production pipeline
        run: python scripts/run_pipeline.py all
      - name: Verify production data contract
        run: python scripts/data_quality.py
      - name: Commit verified data only
        run: |
          git config user.name 'quant-bot'
          git config user.email 'quant-bot@users.noreply.github.com'
          git add data/
          git diff --cached --quiet || git commit -m 'data: verified production scan'
          git push
