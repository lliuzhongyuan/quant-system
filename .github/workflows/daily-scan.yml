name: 每日全市场量化扫描
on:
  push:
    paths:
      - '.github/workflows/daily-scan.yml'
      - 'scripts/data_sources.py'
      - 'scripts/engine.py'
      - 'scripts/run_pipeline.py'
      - 'scripts/provider_probe.py'
      - 'scripts/universe_snapshot.py'
      - 'scripts/index_sources.py'
      - 'scripts/index_probe.py'
  schedule:
    - cron: '50 0 * * 1-5'
    - cron: '20 7 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quant-daily-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Report build commit
        run: git log -1 --format='commit=%H%nsubject=%s'
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Build dynamic universe
        run: python scripts/universe_snapshot.py
      - name: Provider preflight
        run: python scripts/provider_probe.py
      - name: Index provider preflight
        run: python scripts/index_probe.py
      - name: Run production pipeline
        run: python scripts/run_pipeline.py all
      - name: Verify production data contract
        run: python scripts/data_quality.py
      - name: Commit verified data only
        run: |
          git config user.name 'quant-bot'
          git config user.email 'quant-bot@users.noreply.github.com'
          git add data/ ':!data/kline_cache/'
          git diff --cached --quiet || git commit -m 'data: verified production scan'
          git push
