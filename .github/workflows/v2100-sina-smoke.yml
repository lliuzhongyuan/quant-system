name: V2100 新浪数据源烟雾测试
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Sina stock list
        run: |
          curl --fail --silent --show-error --location --max-time 20 'https://vip.stock.finance.sina.com.cn/quotes_service/api/json_v2.php/Market_Center.getHQNodeData?node=sh_a&page=1&num=80&sort=symbol&asc=1' -o /tmp/sina.json
          python -c "import json; d=json.load(open('/tmp/sina.json')); print('sina sh_a=',len(d)); assert len(d)>20"
      - name: Test Sina Kline
        run: |
          curl --fail --silent --show-error --location --max-time 20 'https://money.finance.sina.com.cn/quotes_service/api/json_v2.php/CN_MarketData.getKLineData?symbol=sh600519&scale=240&ma=5,10,20,60&datalen=130' -o /tmp/k.json
          python -c "import json; d=json.load(open('/tmp/k.json')); print('sina kline=',len(d)); assert len(d)>60"
