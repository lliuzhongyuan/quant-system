name: V3200 Real Data Acceptance
on:
  push:
    branches: [v3200-gemini-realdata-integration]
    paths:
      - 'engine/**'
      - 'scripts/data_sources.py'
      - 'scripts/v3200_realdata_probe.py'
      - 'requirements.txt'
      - '.github/workflows/v3200-realdata-probe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Real data acceptance probe
        run: python scripts/v3200_realdata_probe.py
      - name: Commit probe report
        if: success()
        run: |
          git config user.name 'quant-bot'
          git config user.email 'quant-bot@users.noreply.github.com'
          git add data/v3200_realdata_probe.json
          git diff --cached --quiet || git commit -m 'data: V3200 real data acceptance'
          git push
