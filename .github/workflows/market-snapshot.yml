name: 盘中实时市场快照
on:
  schedule:
    - cron: '*/5 1-7 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python scripts/market_snapshot.py
      - name: Commit snapshot
        run: |
          git config user.name 'quant-bot'
          git config user.email 'quant-bot@users.noreply.github.com'
          git add data/market.json
          git diff --cached --quiet || git commit -m "data: market snapshot"
          git push
