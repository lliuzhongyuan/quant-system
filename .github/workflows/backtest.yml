name: 策略历史回测
on:
  schedule:
    - cron: '30 8 * * 6'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python scripts/backtest.py
      - name: Commit backtest
        run: |
          git config user.name 'quant-bot'
          git config user.email 'quant-bot@users.noreply.github.com'
          git add data/backtest.json
          git diff --cached --quiet || git commit -m 'data: strategy backtest'
          git push
