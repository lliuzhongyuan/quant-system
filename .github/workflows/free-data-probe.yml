name: 免费数据源实验
on:
  push:
    paths:
      - '.github/workflows/free-data-probe.yml'
      - 'scripts/free_source_probe_v2.py'
      - 'scripts/provider_probe.py'
      - 'scripts/data_sources.py'
      - 'requirements.txt'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: free-data-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Probe all free providers
        run: python scripts/free_source_probe_v2.py
      - name: Show provider result
        if: always()
        run: cat data/free_source_probe.json || true
      - name: Commit probe result
        if: success()
        run: |
          git config user.name 'quant-bot'
          git config user.email 'quant-bot@users.noreply.github.com'
          git add data/free_source_probe.json
          git diff --cached --quiet || git commit -m 'data: free provider probe result'
          git push
